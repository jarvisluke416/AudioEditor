name: Build AudioEditor for Windows

on:
  workflow_dispatch:

  push:
    tags:
      - "v*"

jobs:
  build-windows:
    name: Build Windows Release
    runs-on: windows-latest

    steps:

      # ==================================================
      # Checkout repository
      # ==================================================

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      # ==================================================
      # Verify JUCE submodule
      # ==================================================

      - name: Verify JUCE
        shell: powershell
        run: |
          Write-Host "Checking JUCE submodule..."

          if (-not (Test-Path "JUCE")) {
              Write-Error "JUCE directory was not found."
              exit 1
          }

          if (-not (Test-Path "JUCE/CMakeLists.txt")) {
              Write-Error "JUCE/CMakeLists.txt was not found."
              exit 1
          }

          Write-Host "JUCE submodule found."

      # ==================================================
      # Configure CMake
      # ==================================================

      - name: Configure CMake
        shell: powershell
        run: |
          cmake `
            -S . `
            -B build `
            -G "Visual Studio 17 2022" `
            -A x64

      # ==================================================
      # Build Release
      # ==================================================

      - name: Build AudioEditor
        shell: powershell
        run: |
          cmake `
            --build build `
            --config Release `
            --parallel

      # ==================================================
      # Find executable
      # ==================================================

      - name: Find AudioEditor executable
        shell: powershell
        run: |
          Write-Host "Searching for AudioEditor.exe..."

          $exe = Get-ChildItem `
            -Path "build" `
            -Filter "AudioEditor.exe" `
            -Recurse `
            -File `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($null -eq $exe) {
              Write-Host ""
              Write-Host "AudioEditor.exe was not found."
              Write-Host ""
              Write-Host "Files produced by the build:"
              Get-ChildItem `
                -Path "build" `
                -Recurse `
                -File |
                Select-Object -ExpandProperty FullName

              exit 1
          }

          Write-Host ""
          Write-Host "Found executable:"
          Write-Host $exe.FullName
          Write-Host ""

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "package" | Out-Null

          Copy-Item `
            $exe.FullName `
            "package\AudioEditor.exe"

      # ==================================================
      # Create ZIP
      # ==================================================

      - name: Create ZIP
        shell: powershell
        run: |
          Compress-Archive `
            -Path "package\AudioEditor.exe" `
            -DestinationPath "AudioEditor-Windows.zip" `
            -Force

          Write-Host ""
          Write-Host "Created:"
          Write-Host "AudioEditor-Windows.zip"

      # ==================================================
      # Upload artifact
      # ==================================================

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: AudioEditor-Windows
          path: AudioEditor-Windows.zip
          if-no-files-found: error

      # ==================================================
      # Create GitHub Release for version tags
      # ==================================================

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: AudioEditor-Windows.zip
          generate_release_notes: true
